# fly launch  (después: fly secrets set FUTURES_USER=... FUTURES_PASSWORD=...)
app = "dashboard-tc-noticias"
primary_region = "eze"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  ENABLE_FUTURES = "true"
  FUTURES_BASE_URL = "https://api.remarkets.primary.com.ar"
  A3_MATRIZ_WS_URL = "wss://matbarofex.primary.ventures/ws"
  A3_MD_TOPIC = "md.rx_DDF_DLR_SPOT"
  A3_MAYORISTA_SYMBOL = "DLR/SPOT"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
