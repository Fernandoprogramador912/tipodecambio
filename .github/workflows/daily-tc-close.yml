# Cierre de rueda ~15:40 ART (18:40 UTC), días hábiles: resultado del día en la memoria
# (evalúa las recomendaciones ESPERAR/CERRAR), archivo de noticias y análisis de cierre.
# Respaldo del cron interno por si Render (plan free) estaba dormido a las 15:30.
# Requiere secrets: APP_URL, PROJECTION_JOB_SECRET (mismo header x-job-secret)
name: Daily TC close

on:
  schedule:
    - cron: '40 18 * * 1-5'
  workflow_dispatch:

jobs:
  run-close:
    runs-on: ubuntu-latest
    steps:
      - name: Run post-session jobs
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "Configurá APP_URL"
            exit 1
          fi
          if [ -z "${{ secrets.PROJECTION_JOB_SECRET }}" ]; then
            echo "Configurá PROJECTION_JOB_SECRET"
            exit 1
          fi

          BASE="${{ secrets.APP_URL }}"
          BASE="${BASE%/}"

          # Despertar Render (cold start)
          for i in 1 2 3 4 5; do
            curl -fsS --max-time 60 "$BASE/api/health" && break
            echo "Reintento $i (cold start)…"
            sleep 15
          done
          echo ""

          curl -fsS --max-time 120 -X POST "$BASE/api/tc-memory/close-run" \
            -H "x-job-secret: ${{ secrets.PROJECTION_JOB_SECRET }}" \
            -H "content-type: application/json" \
            -d '{}' \
            | head -c 2000
          echo ""
          echo "OK $(date -u)"
